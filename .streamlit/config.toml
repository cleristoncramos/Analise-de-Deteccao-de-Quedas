chartCategoricalColors = ["#1f3a5f", "#4f6d5a", "#9a7b2f", "#7b2d26", "#5b5b57"]

[theme.sidebar]
backgroundColor = "#e4dfd3"
secondaryBackgroundColor = "#f5f3ee"
